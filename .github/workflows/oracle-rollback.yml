name: Rollback
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA of an existing published image
        type: string
        required: true
      schema_compatible:
        description: I verified this image is compatible with the current Neon schema and Render API
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: oracle-application
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate selection
        env:
          SHA: ${{ inputs.commit }}
          COMPATIBLE: ${{ inputs.schema_compatible }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$COMPATIBLE" == true ]] || exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published digest
        id: image
        env:
          SHA: ${{ inputs.commit }}
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/vokerg/chess-repertoir-trainer:$SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/oracle
        with:
          operation: rollback
          sha: ${{ inputs.commit }}
          digest: ${{ steps.image.outputs.digest }}
          host: ${{ secrets.ORACLE_HOST }}
          user: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          host-key: ${{ secrets.ORACLE_SSH_HOST_KEY }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
