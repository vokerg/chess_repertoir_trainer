name: Temporary VT-302 disabled Analyse fix

on:
  push:
    branches:
      - visual-transformation/vt-302-onboarding-accessibility-polish
    paths:
      - .github/workflows/temporary-vt302-disabled-analyse-fix.yml

permissions:
  contents: write

jobs:
  patch-disabled-analyse-style:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: visual-transformation/vt-302-onboarding-accessibility-polish
          fetch-depth: 0

      - name: Align disabled styling with native buttons
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/features/games/components/games-table.component.css')
          source = path.read_text(encoding='utf-8')
          old = ".games-row-action-link[aria-disabled='true'] {"
          new = '.games-row-action-link:disabled {'
          if old not in source:
              raise SystemExit('Expected legacy aria-disabled selector was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-vt302-disabled-analyse-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/features/games/components/games-table.component.css .github/workflows/temporary-vt302-disabled-analyse-fix.yml
          git commit -m "fix(web): style disabled Analyse buttons"
          git push origin HEAD:visual-transformation/vt-302-onboarding-accessibility-polish
