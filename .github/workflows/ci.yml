name: ONB-007 completion reconciliation

on:
  pull_request:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: onb-007/issue-154-completion-record

      - name: Reconcile canonical ONB-007 completion records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'north-star/onboarding/TASKS.md': [
              ('Last updated: 2026-08-03', 'Last updated: 2026-08-04'),
              ('| 50 | ONB-007 | [#154](https://github.com/vokerg/chess_repertoir_trainer/issues/154) | P0 | REVIEW | Benchmark preparation throughput and define truthful progress semantics | Research | Report and reproducible CI evidence complete on PR #266; review/merge pending |', '| 50 | ONB-007 | [#154](https://github.com/vokerg/chess_repertoir_trainer/issues/154) | P0 | DONE | Benchmark preparation throughput and define truthful progress semantics | Research | Squash-merged through PR #266 as `d631382` after corrected benchmark evidence and three self-review rounds |'),
              ('ONB-004 established destructive lifecycle invariants through squash-merged PR #263 as `32db655a100ef1a55264b4d3739e2b7c38e72ee4` and allocated ONB-019/020/021.', 'ONB-004 established destructive lifecycle invariants through squash-merged PR #263 as `32db655a100ef1a55264b4d3739e2b7c38e72ee4` and allocated ONB-019/020/021.\n\nONB-007 established throughput evidence, conservative preparation/import defaults, truthful progress semantics, and implementation validation gates through squash-merged PR #266 as `d6313823bd7da36991972a804f59d47d77578bdf`.'),
              ('## ONB-007 review delivery', '## ONB-007 completed delivery'),
              ('- representative 10/50/200-game and 16/40/80-ply profiles;', '- synthetic 10/50/200-game scale profiles and deterministic legal 16/40/80-ply length profiles;'),
              ('- evidence `reports/artifacts/ONB-007-2026-08-03-ci-benchmark-summary.json`;', '- original evidence `reports/artifacts/ONB-007-2026-08-03-ci-benchmark-summary.json`;\n- corrected provider-timing evidence `reports/artifacts/ONB-007-2026-08-04-ci-benchmark-summary.json`;\n- self-review addenda `reports/ONB-007-2026-08-03-self-review-addendum.md` and `reports/ONB-007-2026-08-04-third-self-review-addendum.md`;'),
              ('Review acceptance and merge remain pending through PR #266.', 'Completed through squash-merged PR #266 as `d6313823bd7da36991972a804f59d47d77578bdf`.'),
              ('ONB-007 / #154 is in review. The next claimable task by canonical order is ONB-005 / #152.', 'ONB-007 / #154 is complete. The next claimable task by canonical order is ONB-005 / #152.'),
            ],
            'north-star/onboarding/ROADMAP.md': [
              ('Last updated: 2026-08-03', 'Last updated: 2026-08-04'),
              ('ONB-007 throughput/progress evidence — REVIEW', 'ONB-007 throughput/progress evidence — DONE'),
              ('- ONB-007 / #154 — throughput/progress — `REVIEW` on PR #266.', '- ONB-007 / #154 — throughput/progress — `DONE` through squash-merged PR #266 as `d631382`.'),
              ('ONB-007 review contract:', 'ONB-007:'),
            ],
            'north-star/onboarding/GITHUB_ISSUES.md': [
              ('Last updated: 2026-08-03', 'Last updated: 2026-08-04'),
              ('ONB-007 is `REVIEW` on PR #266. The next deterministic READY research task is ONB-005 / #152.', 'ONB-007 is `DONE` through squash-merged PR #266 as `d6313823bd7da36991972a804f59d47d77578bdf`; issue #154 is closed completed. The next deterministic READY research task is ONB-005 / #152.'),
            ],
            'north-star/onboarding/STATUS.md': [
              ('Last updated: 2026-08-03', 'Last updated: 2026-08-04'),
              ('Throughput/progress: ONB-007 research and reproducible CI benchmark complete on [PR #266](https://github.com/vokerg/chess_repertoir_trainer/pull/266); review/merge pending.', 'Throughput/progress: ONB-007 squash-merged through [PR #266](https://github.com/vokerg/chess_repertoir_trainer/pull/266) as `d6313823bd7da36991972a804f59d47d77578bdf` after corrected benchmark evidence and three self-review rounds.'),
              ('Latest report: `reports/ONB-007-2026-08-03-throughput-progress-benchmarks.md`', 'Latest report: `reports/ONB-007-2026-08-04-third-self-review-addendum.md`'),
              ('### ONB-007 review contract', '### ONB-007'),
              ('- representative 10/50/200-game provider/admission and 16/40/80-ply index/analysis fixtures;', '- synthetic 10/50/200-game scale fixtures and deterministic legal 16/40/80-ply length fixtures;'),
              ('- measured 50-game medium index worker wave p90 below 1.8 seconds in CI;', '- measured 50-game medium index worker wave observed maximum below 1.8 seconds in corrected CI;'),
              ('- measured three-game short depth-12 analysis wave first result p90 below 1.8 seconds and total p90 below 3.5 seconds in CI;', '- measured three-game short depth-12 analysis wave first-result observed maximum below 1.8 seconds and total observed maximum about 3.61 seconds in corrected CI;'),
              ('Review acceptance is pending on PR #266.', 'Completed through squash-merged PR #266 as `d6313823bd7da36991972a804f59d47d77578bdf`.'),
              ('- ONB-007 awaits review acceptance/merge, although its initial defaults are documented on PR #266;', '- ONB-007 is complete; its consumers retain implementation-specific telemetry, controlled-clock, concurrency, and canary validation responsibilities;'),
              ('- CI run `30786132287` / #1840 passed lint, build, all opening audits, architecture guardrails, migrations, the hardened benchmark, and the full test suite on benchmark head `e4dd65eddb93340327a6b21adb0fe9d15ab8035d`;', '- CI run `30786132287` / #1840 passed the original benchmark and repository gates;\n- corrected benchmark CI `30877363202` / #1905 passed lint, build, all opening audits, architecture guardrails, migrations, corrected benchmark artifact upload, and the full test suite;\n- final standard CI `30878078284` / #1912 passed lint, build, all opening audits, architecture guardrails, migrations, and the full test suite on head `ee765cac67d12bbd5e41926d6eed9fa1b50fa4bb`;'),
              ('Review ONB-007 / #154 on PR #266. The next claimable research task is ONB-005 / #152; ONB-006 and ONB-017 remain additional READY work after required collision review.', 'Claim ONB-005 / #152 next by canonical order. ONB-006 and ONB-017 remain additional READY work after required collision review.'),
            ],
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'Missing expected text in {filename}: {old}')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add north-star/onboarding/TASKS.md north-star/onboarding/ROADMAP.md north-star/onboarding/GITHUB_ISSUES.md north-star/onboarding/STATUS.md
          git commit -m "docs(onboarding): reconcile ONB-007 completion"
          git push origin HEAD:onb-007/issue-154-completion-record
