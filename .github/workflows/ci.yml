name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_trainer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d chess_trainer_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_trainer_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/chess_trainer_ci
      WEB_API_BASE_URL: /api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Opening classification audit
        run: npm --silent run opening-book:classification-audit --workspace=apps/api > opening-classification-audit.json

      - name: Upload opening classification audit
        uses: actions/upload-artifact@v4
        with:
          name: opening-classification-audit
          path: opening-classification-audit.json

      - name: Opening knowledge audit
        run: npm --silent run opening-book:knowledge-audit --workspace=apps/api > opening-knowledge-audit.json

      - name: Upload opening knowledge audit
        uses: actions/upload-artifact@v4
        with:
          name: opening-knowledge-audit
          path: opening-knowledge-audit.json

      - name: Architecture guardrails
        run: npm run check:architecture

      - name: Apply database migrations
        run: npm run db:migrate --workspace=apps/api

      - name: ONB-007 self-review benchmark command
        env:
          ONBOARDING_BENCHMARK_REPORT_PATH: onboarding-throughput-self-review.json
        run: npm run benchmark:onboarding --workspace=apps/api

      - name: Upload ONB-007 self-review benchmark
        uses: actions/upload-artifact@v4
        with:
          name: onb-007-self-review-benchmark
          path: apps/api/onboarding-throughput-self-review.json
          if-no-files-found: error

      - name: Imported-game opening classification audit
        run: npm --silent run opening-book:classification-game-audit --workspace=apps/api > imported-game-opening-classification-audit.json

      - name: Upload imported-game opening classification audit
        uses: actions/upload-artifact@v4
        with:
          name: imported-game-opening-classification-audit
          path: imported-game-opening-classification-audit.json

      - name: Imported-game opening knowledge audit
        run: npm --silent run opening-book:knowledge-game-audit --workspace=apps/api > imported-game-opening-knowledge-audit.json

      - name: Upload imported-game opening knowledge audit
        uses: actions/upload-artifact@v4
        with:
          name: imported-game-opening-knowledge-audit
          path: imported-game-opening-knowledge-audit.json

      - name: Test
        env:
          TRAP_PILOT_REPORT_PATH: trap-pilot-validation.txt
        run: npm test

      - name: Upload trap validation report
        if: always() && hashFiles('apps/api/trap-pilot-validation.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trap-pilot-validation
          path: apps/api/trap-pilot-validation.txt
          if-no-files-found: error
