name: Temporary ONB-006 format reconciliation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile-format:
    if: github.head_ref == 'onb-006/reconciled-issue-153'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: onb-006/reconciled-issue-153
          fetch-depth: 0
      - name: Correct reconciliation formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          import re

          roadmap = Path('north-star/onboarding/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          pattern = re.compile(
              r'^[ \t]*ONB-021 whole-user/mobile purge\n'
              r'^[ \t]*\+\n'
              r'^[ \t]*ONB-006 cleanup research — DONE\n'
              r'^[ \t]*↓\n'
              r'^[ \t]*ONB-026 bounded orphan cleanup implementation\n'
              r'^[ \t]*↓\n'
              r'^[ \t]*ONB-024 administrator lifecycle adapters$',
              re.M,
          )
          replacement = (
              '                    ONB-021 whole-user/mobile purge\n'
              '                               +\n'
              '                    ONB-006 cleanup research — DONE\n'
              '                               ↓\n'
              '                    ONB-026 bounded orphan cleanup implementation\n'
              '                               ↓\n'
              '                    ONB-024 administrator lifecycle adapters'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'roadmap cleanup block: expected one match, found {count}')
          roadmap.write_text(text.rstrip() + '\n', encoding='utf-8')

          questions = Path('north-star/onboarding/OPEN_QUESTIONS.md')
          text = questions.read_text(encoding='utf-8')
          old = '- schema/migration coordination with ONB-011, ONB-017, and ONB-019.\n## ONB-007 / #154'
          new = '- schema/migration coordination with ONB-011, ONB-017, and ONB-019.\n\n## ONB-007 / #154'
          if text.count(old) != 1:
              raise RuntimeError('open-questions section break not found exactly once')
          questions.write_text(text.replace(old, new, 1).rstrip() + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/reconcile-onb006-format-temp.yml
          git add -A
          git diff --cached --check
          git commit -m "docs(onboarding): finalize ONB-006 reconciliation formatting"
          git push origin HEAD:onb-006/reconciled-issue-153
