name: Temporary VT-302 focus remediation

on:
  push:
    branches:
      - visual-transformation/vt-302-onboarding-accessibility-polish
    paths:
      - .github/workflows/temporary-vt302-focus-remediation.yml

permissions:
  contents: write

jobs:
  remediate-focus-outlines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: visual-transformation/vt-302-onboarding-accessibility-polish
          fetch-depth: 0

      - name: Replace low-contrast standalone focus outlines
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/web/src')
          changed = []
          replacement_count = 0

          token_pattern = re.compile(
              r'outline:\s*([^;\n]+?)\s+solid\s+var\(--ui-focus-ring\);'
          )
          literal_pattern = re.compile(
              r'outline:\s*([^;\n]+?)\s+solid\s+rgba\(\s*31\s*,\s*120\s*,\s*101\s*,\s*0\.38\s*\);'
          )

          for path in sorted(root.rglob('*.css')):
              original = path.read_text(encoding='utf-8')
              updated, token_count = token_pattern.subn(
                  lambda match: f'outline: {match.group(1)} solid var(--ui-focus-outline);',
                  original,
              )
              updated, literal_count = literal_pattern.subn(
                  lambda match: f'outline: {match.group(1)} solid var(--ui-focus-outline);',
                  updated,
              )
              count = token_count + literal_count
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  replacement_count += count

          if replacement_count == 0:
              raise SystemExit('No low-contrast standalone focus outlines were found')

          print(f'Replaced {replacement_count} outline declarations across {len(changed)} files')
          for path in changed:
              print(path)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-vt302-focus-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src .github/workflows/temporary-vt302-focus-remediation.yml
          git commit -m "fix(web): use contrast-safe focus outlines"
          git push origin HEAD:visual-transformation/vt-302-onboarding-accessibility-polish
