name: Temporary ONB-006 final consistency

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile-final:
    if: github.head_ref == 'onb-006/reconciled-issue-153'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: onb-006/reconciled-issue-153
          fetch-depth: 0
      - name: Finalize canonical consistency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1).rstrip() + '\n', encoding='utf-8')

          tasks = 'north-star/onboarding/TASKS.md'
          replace_once(
              tasks,
              '| 210 | ONB-024 | [#274](https://github.com/vokerg/chess_repertoir_trainer/issues/274) | P1 | PROPOSED | Add administrator lifecycle previews and controls | Implementation | ONB-022/023; ONB-019 plus applicable ONB-020/021; ONB-006 for cleanup exposure |',
              '| 210 | ONB-024 | [#274](https://github.com/vokerg/chess_repertoir_trainer/issues/274) | P1 | PROPOSED | Add administrator lifecycle previews and controls | Implementation | ONB-022/023; ONB-019 plus applicable ONB-020/021; ONB-026 for cleanup exposure |',
              'ONB-024 cleanup dependency',
          )
          replace_once(tasks, '|\n\n\nONB-025 / #276', '|\n\nONB-025 / #276', 'TASKS reservation spacing')
          replace_once(
              tasks,
              'remain governed by their listed dependencies.\n## Implementation backlog rule',
              'remain governed by their listed dependencies.\n\n## Implementation backlog rule',
              'TASKS section break',
          )

          status = 'north-star/onboarding/STATUS.md'
          replace_once(
              status,
              'Before claiming ONB-022, re-inspect current authentication, deployment topology, and ONB-019 actor-key activity.\n## Allocated implementation backlog',
              'Before claiming ONB-022, re-inspect current authentication, deployment topology, and ONB-019 actor-key activity.\n\n## Allocated implementation backlog',
              'STATUS section break',
          )

          task = 'north-star/onboarding/tasks/ONB-006-orphan-position-cleanup.md'
          replace_once(
              task,
              '- ONB-005 administrator action/audit draft in PR #275',
              '- accepted ONB-005 administrator action/audit contract from PR #275',
              'ONB-006 ONB-005 anchor',
          )
          replace_once(
              task,
              '- Reconciled task numbering against active PR #275 (ONB-022–024) and PR #279 (ONB-025); allocated ONB-026.',
              '- Reconciled task numbering against merged PR #275 (ONB-022–024) and active PR #279 (ONB-025); allocated ONB-026.',
              'ONB-006 allocation history',
          )

          report = 'north-star/onboarding/reports/ONB-006-2026-08-04-orphan-shared-position-cleanup.md'
          replace_once(
              report,
              '- active PRs #275 and #279',
              '- merged PR #275 and active PR #279',
              'report inspected PR state',
          )

          assertions = {
              tasks: [
                  'ONB-026 for cleanup exposure',
                  '\n\n## Implementation backlog rule',
                  'ONB-017 / #253 remains `IN_PROGRESS`',
              ],
              status: [
                  '\n\n## Allocated implementation backlog',
                  'Next unclaimed `READY` task: ONB-022',
              ],
              task: [
                  'accepted ONB-005 administrator action/audit contract from PR #275',
                  'merged PR #275 (ONB-022–024) and active PR #279',
              ],
              report: ['merged PR #275 and active PR #279'],
              'north-star/onboarding/ROADMAP.md': [
                  '                    ONB-021 whole-user/mobile purge\n                               +\n                    ONB-006 cleanup research — DONE',
                  '## Phase 11 — Orphan shared-position cleanup',
                  '## Phase 14 — Administrator lifecycle adapters',
              ],
              'north-star/onboarding/OPEN_QUESTIONS.md': [
                  'schema/migration coordination with ONB-011, ONB-017, and ONB-019.\n\n## ONB-007 / #154',
              ],
          }
          for path, needles in assertions.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise RuntimeError(f'{path}: missing required text {needle!r}')

          forbidden = {
              tasks: ['ONB-006 for cleanup exposure'],
              task: ['administrator action/audit draft in PR #275', 'active PR #275 (ONB-022–024)'],
              report: ['active PRs #275 and #279'],
          }
          for path, needles in forbidden.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle in text:
                      raise RuntimeError(f'{path}: stale text remains {needle!r}')
          PY
          rm -f .github/workflows/reconcile-onb006-final-temp.yml
          git add -A
          git diff --cached --check
          git commit -m "docs(onboarding): finalize ONB-006 canonical consistency"
          git push origin HEAD:onb-006/reconciled-issue-153
