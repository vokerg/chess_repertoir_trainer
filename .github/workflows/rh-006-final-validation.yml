name: RH-006 final validation

on:
  push:
    branches:
      - maintenance/rh-006-tar-remediation

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chess_trainer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d chess_trainer_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chess_trainer_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/chess_trainer_ci
      WEB_API_BASE_URL: /api

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: maintenance/rh-006-tar-remediation

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2> >(tee npm-ci-stderr.log >&2)

      - name: Dependency audit report
        run: npm run audit:dependencies -- --npm-ci-log npm-ci-stderr.log

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v6
        with:
          name: rh-006-final-dependency-audit
          path: |
            dependency-audit-report.json
            dependency-audit-report.md
            npm-ci-stderr.log
          if-no-files-found: error

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Opening classification audit
        run: npm --silent run opening-book:classification-audit --workspace=apps/api > opening-classification-audit.json

      - name: Opening knowledge audit
        run: npm --silent run opening-book:knowledge-audit --workspace=apps/api > opening-knowledge-audit.json

      - name: Architecture guardrails
        run: npm run check:architecture

      - name: Repository hygiene guardrails
        run: npm run check:hygiene

      - name: Apply database migrations
        run: npm run db:migrate --workspace=apps/api

      - name: Imported-game opening classification audit
        run: npm --silent run opening-book:classification-game-audit --workspace=apps/api > imported-game-opening-classification-audit.json

      - name: Imported-game opening knowledge audit
        run: npm --silent run opening-book:knowledge-game-audit --workspace=apps/api > imported-game-opening-knowledge-audit.json

      - name: Test
        env:
          TRAP_PILOT_REPORT_PATH: trap-pilot-validation.txt
        run: npm test

      - name: Remove validation workflow
        shell: bash
        run: |
          rm .github/workflows/rh-006-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rh-006-final-validation.yml
          git commit -m "chore: remove RH-006 final validation workflow"
          git push origin HEAD:maintenance/rh-006-tar-remediation
