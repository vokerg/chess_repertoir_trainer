<section class="games-page stack">
  <app-page-header
    title="Games"
    subtitle="Explore imported games, review the evidence, and submit durable processing jobs."
    [stats]="headerStats()"
    [actions]="headerActions()"
  />

  <section class="games-filter-workspace" aria-label="Game filters">
    <app-game-filter-panel
      presentation="explorer"
      [filters]="store.filters()"
      [facets]="store.facets()"
      [loading]="store.loading()"
      (filtersChange)="store.setFilters($event)"
      (apply)="applyFilters()"
      (reset)="resetFilters()"
    />

    @if (store.unrepresentedCriteriaSummary().length) {
      <aside class="route-filter-summary" aria-label="Additional applied filters">
        <strong>Additional URL filters</strong>
        <span>{{ store.unrepresentedCriteriaSummary().join(' · ') }}</span>
      </aside>
    }
  </section>

  <app-games-table
    [games]="store.filteredGames()"
    [loading]="store.loading()"
    [error]="store.error()"
    [tableSubtitle]="store.tableSubtitle()"
    [pageInfo]="store.pageInfo()"
    (refresh)="store.refresh()"
    (loadMore)="store.loadMore()"
    (analyse)="store.analyse($event)"
  />
</section>
