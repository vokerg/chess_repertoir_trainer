<section class="study-page stack">
  <app-page-header
    title="Study"
    subtitle="Choose the material, set the focus, and start one clear training session."
  />

  <section class="study-workspace" aria-label="Study session builder">
    <aside class="study-material-column">
      <app-panel
        class="study-material-panel"
        title="Choose material"
        subtitle="Pick a repertoire, then narrow it to a section."
      >
        <app-study-scope-list
          title="Repertoires"
          [items]="courseItems()"
          [selectedId]="store.selectedCourseId()"
          [loading]="store.courseLoading()"
          [error]="store.courseError()"
          emptyText="No repertoires are available."
          (selectItem)="store.selectCourse($event)"
        />

        <div class="material-divider" aria-hidden="true"></div>

        <app-study-scope-list
          title="Sections"
          [items]="chapterItems()"
          [selectedId]="store.selectedChapterId()"
          [loading]="store.chapterLoading()"
          [error]="store.chapterError()"
          emptyText="Choose a repertoire to see its sections."
          (selectItem)="store.selectChapter($event)"
        />
      </app-panel>
    </aside>

    <main class="study-lines-column">
      <app-study-line-list
        [title]="selectedChapterTitle()"
        [subtitle]="selectedChapterSubtitle()"
        [lines]="store.filteredLines()"
        [selectedLineIds]="store.selectedLineIds()"
        [searchText]="store.searchText()"
        [loading]="store.lineLoading()"
        [error]="store.lineError()"
        (searchTextChange)="store.searchText.set($event)"
        (toggleLine)="store.toggleLineSelection($event)"
        (selectAllVisible)="store.selectAllVisibleLines()"
        (clearSelection)="store.clearLineSelection()"
      />
    </main>

    <app-training-basket-panel
      class="study-session-column"
      [activeSublineCount]="store.basketActiveSublineCount()"
      [weakSublineCount]="store.basketWeakSublineCount()"
      [untrainedSublineCount]="store.basketUntrainedSublineCount()"
      [sourceLabel]="store.basketSourceLabel()"
      [scope]="store.trainingScope()"
      [mode]="store.marathonMode()"
      [canUseCourseScope]="store.canUseCourseScope()"
      [canUseChapterScope]="store.canUseChapterScope()"
      [canUseSelectedLinesScope]="store.canUseSelectedLinesScope()"
      [canStart]="store.canStartBasket()"
      (scopeChange)="store.setTrainingScope($event)"
      (modeChange)="store.setMarathonMode($event)"
      (startMode)="store.startSelectedMarathon($event.mode, $event.scope)"
    />
  </section>
</section>
