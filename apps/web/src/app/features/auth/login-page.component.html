<app-auth-shell
  eyebrow="Welcome back"
  heading="Sign in"
  headingId="login-title"
  description="Continue building your repertoire from your games and training history."
>
  @if (isDevAuth()) {
    <div class="dev-auth-state">
      <strong>Local development access</strong>
      <p>External authentication is not configured for this web build.</p>
      <a [routerLink]="returnUrl" class="auth-action">Continue to application</a>
    </div>
  } @else {
    <div #signInMount class="clerk-mount" aria-label="Sign in"></div>
    <p class="switch-auth">New here? <a routerLink="/signup" [queryParams]="authQueryParams">Create an account</a></p>
  }

  @if (appUserError()) {
    <p class="auth-error" role="alert">{{ appUserError() }}</p>
  }
</app-auth-shell>
