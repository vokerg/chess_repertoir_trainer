<app-auth-shell
  eyebrow="Start building"
  heading="Create account"
  headingId="signup-title"
  description="Connect your games, repertoire work, and training in one account."
>
  @if (isDevAuth()) {
    <div class="dev-auth-state">
      <strong>Local development access</strong>
      <p>External authentication is not configured for this web build.</p>
      <a routerLink="/library" class="auth-action">Continue to library</a>
    </div>
  } @else {
    <div #signUpMount class="clerk-mount" aria-label="Create account"></div>
    <p class="switch-auth">Already have an account? <a routerLink="/login" [queryParams]="authQueryParams">Sign in</a></p>
  }

  @if (appUserError()) {
    <p class="auth-error" role="alert">{{ appUserError() }}</p>
  }
</app-auth-shell>
