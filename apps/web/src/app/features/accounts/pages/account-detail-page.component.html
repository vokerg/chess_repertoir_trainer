<section class="account-detail-page stack">
  <app-page-header [title]="pageTitle()" [subtitle]="pageSubtitle()" [actions]="headerActions()" />

  @if (accountsError(); as error) {
    <app-state-message tone="error" [message]="error" />
  }

  @if (accountError(); as error) {
    <app-panel title="Account unavailable">
      <app-state-message tone="error" [message]="error" />
    </app-panel>
  } @else {
    <app-panel title="Account overview" subtitle="Imported account metadata.">
      @if (accountLoading() && !account()) {
        <app-state-message tone="loading" message="Loading account..." />
      }

      @if (account(); as account) {
        <div class="account-overview-content">
          <app-fact-grid
            [items]="accountFacts()"
            ariaLabel="Account summary"
            [columns]="4"
            [compactColumns]="1"
          />

          <label class="account-switcher">
            <span>Account</span>
            <select
              [value]="accountId() ?? ''"
              (change)="onAccountSelectionChange($any($event.target).value)"
              [disabled]="accountsLoading() || accounts().length === 0"
            >
              @if (accountsLoading()) {
                <option value="">Loading accounts...</option>
              }
              @for (option of accountOptions(); track option.id) {
                <option [value]="option.id">{{ accountOptionLabel(option) }}</option>
              }
            </select>
          </label>
        </div>
      }
    </app-panel>

    <app-account-profile-signal-cards
      [stats]="ratingStats()"
      [performance]="performanceStats()"
      [history]="history()"
      [selectedSpeed]="selectedSpeed()"
      [loading]="ratingStatsLoading() || performanceStatsLoading()"
    />

    <div class="profile-main-grid">
      <app-panel
        title="Rating history"
        subtitle="Daily maximum recorded rating from imported games."
      >
        <app-rating-history-chart
          [history]="history()"
          [loading]="historyLoading()"
          [error]="historyError()"
          [selectedRange]="selectedRange()"
          [selectedSpeed]="selectedSpeed()"
          (selectedRangeChange)="onSelectedRangeChange($event)"
          (selectedSpeedChange)="onSelectedSpeedChange($event)"
        />
      </app-panel>

      <div class="profile-side-stack">
        <app-panel title="What stands out" subtitle="A quick read across your rating pools.">
          <app-account-profile-coach-read
            [stats]="ratingStats()"
            [performance]="performanceStats()"
          />
        </app-panel>
        <app-panel
          title="Game shape"
          subtitle="Results and opponent strength for the selected period."
        >
          <app-account-profile-game-shape [stats]="performanceStats()" [range]="selectedRange()" />
        </app-panel>
      </div>
    </div>

    <div class="profile-lower-grid">
      <app-panel title="Your milestones" subtitle="Keep the progress that matters visible.">
        <app-account-profile-progress
          [stats]="ratingStats()"
          [loading]="ratingStatsLoading()"
          [error]="ratingStatsError()"
        />
      </app-panel>

      <app-panel
        title="The games that tell the story"
        subtitle="Switch between recent play and standout results."
      >
        <app-account-profile-evidence
          [stats]="performanceStats()"
          [loading]="performanceStatsLoading()"
          [error]="performanceStatsError()"
        />
      </app-panel>
    </div>
  }
</section>
