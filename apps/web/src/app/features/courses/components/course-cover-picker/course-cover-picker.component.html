<fieldset class="cover-picker">
  <legend>Course cover</legend>
  <div class="cover-options">
    @for (option of options(); track option.key) {
      <label class="cover-option" [class.cover-option-selected]="selectedKey() === option.key">
        <input
          type="radio"
          [name]="'course-cover-' + side()"
          [value]="option.key"
          [checked]="selectedKey() === option.key"
          (change)="selectedKeyChange.emit(option.key)"
        />
        <img [src]="option.imageUrl" [alt]="option.alt" />
        <span>{{ option.label }}</span>
      </label>
    }
  </div>
</fieldset>
