<section class="line-train-page">
  @if (store.loading()) {
    <app-panel
      title="Loading training focus"
      subtitle="Preparing the selected active subline and its latest training state."
    >
      <app-state-message tone="loading" message="Loading training focus..." />
    </app-panel>
  } @else if (!store.sessionId()) {
    <app-panel
      title="Training unavailable"
      subtitle="The selected line could not be prepared for training."
    >
      @if (store.error(); as error) {
        <app-state-message tone="error" [message]="error" />
      } @else {
        <app-state-message tone="empty" message="No training session is available for this line." />
      }
      <a class="compact-action secondary" routerLink="/library">Back to library</a>
    </app-panel>
  } @else {
    <div class="line-train-header-shell">
      <a routerLink="/library" class="training-back-link">&larr; Library / Training focus</a>
      <app-page-header
        [title]="store.lineName()"
        subtitle="Play the selected active subline from memory."
        [stats]="headerStats()"
        [actions]="headerActions()"
      />
    </div>

    @if (store.error(); as error) {
      <app-state-message tone="error" [message]="error" />
    }

    <app-line-training-session
      [sessionId]="store.sessionId()"
      [currentFen]="store.currentFen()"
      [expectedMove]="store.expectedMove()"
      [sideToTrain]="store.sideToTrain()"
      [feedback]="store.feedback()"
      [feedbackCorrect]="store.feedbackCorrect()"
      [mistakesCount]="store.mistakesCount()"
      [completed]="store.completed()"
      [passed]="store.passed()"
      [accuracy]="store.accuracy()"
      [showExpectedMove]="store.showExpectedMove()"
      [reviewLoading]="store.reviewLoading()"
      [mistakes]="store.mistakes()"
      [error]="store.error()"
      [lastMove]="store.lastMove()"
      [boardPositionVersion]="store.boardPositionVersion()"
      goalSubtitle="Play the selected active subline from memory. Keep the expected move hidden unless you are stuck."
      [secondaryActionLink]="['/library']"
      secondaryActionLabel="Back to library"
      [editActionLink]="['/lines', store.line()?.id, 'edit']"
      (boardMove)="store.playBoardMove($event)"
      (toggleExpectedMove)="store.toggleExpectedMove()"
      (finish)="store.finishTraining()"
      (primaryAction)="store.startTraining()"
    />
  }
</section>
