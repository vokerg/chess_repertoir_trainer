<section class="line-editor-page stack">
  @if (store.loading()) {
    <app-panel title="Loading line editor" subtitle="Preparing the move tree, board position, and supporting evidence.">
      <p class="status-note" aria-live="polite">Loading editor...</p>
      @if (store.error(); as error) {
        <p class="status-error" role="alert">{{ error }}</p>
      }
    </app-panel>
  } @else {
    <app-page-header
      [title]="store.line()?.name || 'Line editor'"
      subtitle="Build the repertoire tree, inspect position evidence, and annotate the selected move."
      [stats]="headerStats()"
      [actions]="headerActions()"
    />

    @if (store.error(); as error) {
      <p class="status-error" role="alert">{{ error }}</p>
    }

    @if (store.tree(); as tree) {
      <app-line-editor-workbench
        [tree]="tree"
        [selectedNodeId]="store.selectedNodeId()"
        [nodeId]="store.selectedNode()?.node?.id ?? null"
        [branchLabel]="store.selectedNode()?.node?.branchLabel"
        [comment]="store.selectedNode()?.node?.comment"
        [annotation]="store.selectedNode()?.node?.annotation"
        [currentFen]="store.currentFen()"
        [side]="store.line()?.sideToTrain || 'WHITE'"
        [blackPerspective]="store.blackPerspective()"
        [lastMove]="store.lastMove()"
        [arrows]="store.analysisArrows()"
        [boardPositionVersion]="store.boardPositionVersion()"
        [analysis]="store.engineAnalysis()"
        [engineWarning]="store.engineWarning()"
        [canGoBackward]="store.canGoBackward()"
        [canGoForward]="store.canGoForward()"
        [deleting]="store.deleting()"
        [notesSaving]="store.notesSaving()"
        [notesSaved]="store.notesSaved()"
        [notesError]="store.notesError()"
        [gamesAnalysis]="store.gamesAnalysis()"
        [gamesLoading]="store.gamesLoading()"
        [gamesError]="store.gamesError()"
        [gamesFilters]="store.gamesFilters()"
        [gamesFacets]="store.gamesFacets()"
        (boardMove)="store.playBoardMove($event)"
        (nodeSelected)="store.selectNode($event)"
        (goStart)="store.goToStart()"
        (goPrevious)="store.goToPrevious()"
        (goNext)="store.goToNext()"
        (goEnd)="store.goToEnd()"
        (deleteSelectedSubtree)="confirmDeleteSelectedSubtree()"
        (saveNotes)="store.saveNotes($event)"
        (gamesFiltersChange)="store.setGamesFilters($event)"
        (gamesApplyFilters)="store.refreshGamesAnalysis()"
        (gamesResetFilters)="store.resetGamesFilters()"
        (gamesRefresh)="store.refreshGamesAnalysis()"
      />
    }
  }
</section>
