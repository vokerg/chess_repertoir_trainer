<app-analysis-workbench
  [showTreePanel]="movesVisible()"
  [tree]="tree()"
  moveListDisplay="focused"
  [selectedNodeId]="selectedNodeId()"
  [preferredContinuations]="preferredContinuations()"
  [currentFen]="currentFen()"
  [side]="side()"
  [blackPerspective]="blackPerspective()"
  [lastMove]="lastMove()"
  [arrows]="engineVisible() ? arrows() : []"
  [boardPositionVersion]="boardPositionVersion()"
  [engineVisible]="engineVisible()"
  [analysis]="analysis()"
  [engineWarning]="engineVisible() ? engineWarning() : null"
  [canGoBackward]="canGoBackward()"
  [canGoForward]="canGoForward()"
  treeTitle="Move tree"
  treeHelp="Root is the start position. Green-outlined moves are trained-side moves; softer replies are opponent continuations."
  [deleteDisabled]="selectedNodeId() === 0 || deleting()"
  [deleting]="deleting()"
  (boardMove)="boardMove.emit($event)"
  (nodeSelected)="nodeSelected.emit($event)"
  (goStart)="goStart.emit()"
  (goPrevious)="goPrevious.emit()"
  (goNext)="goNext.emit()"
  (goEnd)="goEnd.emit()"
  (deleteSelectedSubtree)="deleteSelectedSubtree.emit()"
>
  <div analysisWorkbenchSideExtra class="line-side-extra-stack">
    @if (gamesVisible()) {
      <app-position-game-moves-panel
        title="Moves from your games"
        subtitle="Use your indexed games to add repertoire continuations from this exact position."
        [analysis]="gamesAnalysis()"
        [loading]="gamesLoading()"
        [error]="gamesError()"
        [filters]="gamesFilters()"
        [facets]="gamesFacets()"
        [filtersCollapsedInitially]="true"
        [compact]="true"
        [showTopGames]="false"
        (filtersChange)="gamesFiltersChange.emit($event)"
        (applyFilters)="gamesApplyFilters.emit()"
        (resetFilters)="gamesResetFilters.emit()"
        (refresh)="gamesRefresh.emit()"
        (moveSelected)="boardMove.emit($event.moveUci)"
      />
    }

    @if (evidenceVisible()) {
      <app-position-evidence-tabs
        idPrefix="line-position-evidence"
        [tabs]="evidenceSources"
        [activeTab]="evidenceTab()"
        (tabChange)="evidenceTabChange.emit($event)"
      >
        @switch (evidenceTab()) {
          @case ('peers') {
            <app-lichess-games-explorer-widget
              [fen]="currentFen()"
              [embedded]="true"
              (moveSelected)="boardMove.emit($event)"
            />
          }
          @case ('masters') {
            <app-masters-explorer-widget
              [fen]="currentFen()"
              [embedded]="true"
              (moveSelected)="boardMove.emit($event)"
            />
          }
        }
      </app-position-evidence-tabs>
    }

    <app-line-notes-editor
      [hidden]="!notesVisible()"
      [style.display]="notesVisible() ? null : 'none'"
      [nodeId]="nodeId()"
      [branchLabelValue]="branchLabel()"
      [commentValue]="comment()"
      [annotationValue]="annotation()"
      [saving]="notesSaving()"
      [saved]="notesSaved()"
      [error]="notesError()"
      (saveNotes)="saveNotes.emit($event)"
    />
  </div>
</app-analysis-workbench>
