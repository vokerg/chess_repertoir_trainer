<div class="profile-filter-stack">
  <div class="profile-filter-grid">
    <div class="profile-field compact">
      <span>Period</span>
      <app-select-menu ariaLabel="Period" [value]="filters().period" [options]="periodOptions" (valueChange)="changePeriod($event)" />
    </div>

    <div class="profile-field">
      <span>Speed</span>
      <app-select-menu ariaLabel="Speed" [value]="filters().speedPreset" [options]="speedOptions" (valueChange)="changeSpeedPreset($event)" />
    </div>

    <fieldset class="profile-field profile-colors">
      <legend>Colour</legend>
      <div class="profile-toggle-group">
        <button
          type="button"
          [class.active]="isColorSelected('WHITE')"
          [attr.aria-pressed]="isColorSelected('WHITE')"
          (click)="colorToggle.emit('WHITE')"
        >
          White
        </button>
        <button
          type="button"
          [class.active]="isColorSelected('BLACK')"
          [attr.aria-pressed]="isColorSelected('BLACK')"
          (click)="colorToggle.emit('BLACK')"
        >
          Black
        </button>
      </div>
    </fieldset>

    <div class="profile-field compact">
      <span>Game status</span>
      <app-select-menu ariaLabel="Game status" [value]="filters().rated ? 'true' : 'false'" [options]="ratedOptions" (valueChange)="changeRated($event)" />
    </div>

    <button
      type="button"
      class="primary profile-recalculate"
      [disabled]="loading()"
      (click)="recalculate.emit()"
    >
      {{ loading() ? 'Calculating…' : 'Recalculate profile' }}
    </button>
  </div>

  <div class="profile-filter-secondary">
    <details class="profile-picker">
      <summary>
        Accounts · {{ filters().accountIds.length === 0 ? 'All' : filters().accountIds.length + ' selected' }}
      </summary>
      <div class="profile-picker-panel" role="group" aria-label="Profile accounts">
        <label>
          <input
            type="checkbox"
            [checked]="filters().accountIds.length === 0"
            (change)="allAccountsSelect.emit()"
          />
          <span>All connected accounts</span>
        </label>
        @if (accountsLoading()) {
          <p class="status-note">Loading accounts…</p>
        } @else {
          @for (account of accounts(); track account.id) {
            <label>
              <input
                type="checkbox"
                [checked]="account.selected"
                (change)="accountToggle.emit(account.id)"
              />
              <span>{{ account.label }}</span>
            </label>
          }
        }
      </div>
    </details>

    <details class="profile-picker">
      <summary>Rating context</summary>
      <div class="profile-rating-grid">
        <label class="profile-field compact">
          <span>My rating from</span>
          <input
            inputmode="numeric"
            placeholder="Any"
            [value]="numericValue(filters().minUserRating)"
            (input)="ratingFilterChange.emit({ key: 'minUserRating', value: $any($event.target).value })"
          />
        </label>
        <label class="profile-field compact">
          <span>My rating to</span>
          <input
            inputmode="numeric"
            placeholder="Any"
            [value]="numericValue(filters().maxUserRating)"
            (input)="ratingFilterChange.emit({ key: 'maxUserRating', value: $any($event.target).value })"
          />
        </label>
        <label class="profile-field compact">
          <span>Opponent from</span>
          <input
            inputmode="numeric"
            placeholder="Any"
            [value]="numericValue(filters().minOpponentRating)"
            (input)="ratingFilterChange.emit({ key: 'minOpponentRating', value: $any($event.target).value })"
          />
        </label>
        <label class="profile-field compact">
          <span>Opponent to</span>
          <input
            inputmode="numeric"
            placeholder="Any"
            [value]="numericValue(filters().maxOpponentRating)"
            (input)="ratingFilterChange.emit({ key: 'maxOpponentRating', value: $any($event.target).value })"
          />
        </label>
        <button type="button" class="secondary profile-clear-rating" (click)="ratingContextClear.emit()">
          Clear ratings
        </button>
      </div>
    </details>
  </div>

  @if (filters().period === 'CUSTOM') {
    <div class="profile-custom-range" aria-label="Custom profile period">
      <label class="profile-field compact">
        <span>From</span>
        <input
          type="date"
          [value]="filters().from"
          (input)="dateChange.emit({ key: 'from', value: $any($event.target).value })"
        />
      </label>
      <label class="profile-field compact">
        <span>To</span>
        <input
          type="date"
          [value]="filters().to"
          (input)="dateChange.emit({ key: 'to', value: $any($event.target).value })"
        />
      </label>
    </div>
  }
</div>
