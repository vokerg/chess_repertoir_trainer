<section
  class="section-card games-filters"
  [class.games-filters-explorer]="presentation() === 'explorer'"
  aria-label="Game filters"
>
  <div class="games-filter-grid">
    <div class="games-field">
      <span>Account</span>
      <app-select-menu ariaLabel="Account" [value]="filters().accountId" [options]="accountOptions()" (valueChange)="setFilterValue('accountId', $event)" />
    </div>
    <div class="games-field">
      <span>Provider</span>
      <app-select-menu ariaLabel="Provider" [value]="filters().provider" [options]="providerOptions" (valueChange)="setFilterValue('provider', $event)" />
    </div>
    <div class="games-field">
      <span>Result</span>
      <app-select-menu ariaLabel="Result" [value]="filters().resultForUser" [options]="resultOptions" (valueChange)="setFilterValue('resultForUser', $event)" />
    </div>
    <div class="games-field">
      <span>Colour</span>
      <app-select-menu ariaLabel="Colour" [value]="lockedUserColor() || filters().userColor" [options]="colorOptions" [disabled]="!!lockedUserColor()" (valueChange)="setFilterValue('userColor', $event)" />
    </div>
    <div class="games-field">
      <span>Control</span>
      <app-select-menu ariaLabel="Control" [value]="filters().speedCategory" [options]="controlOptions()" (valueChange)="setFilterValue('speedCategory', $event)" />
    </div>
    <div class="games-field">
      <span>Rated</span>
      <app-select-menu ariaLabel="Rated" [value]="filters().rated" [options]="ratedOptions" (valueChange)="setFilterValue('rated', $event)" />
    </div>
    <div class="games-field">
      <span>Analysis</span>
      <app-select-menu ariaLabel="Analysis" [value]="filters().analysisStatus" [options]="analysisOptions" (valueChange)="setFilterValue('analysisStatus', $event)" />
    </div>
    <div class="games-field tags-field" #tagsPicker>
      <span>Tags</span>
      <div class="tags-picker">
        <button type="button" class="tags-picker-toggle" aria-haspopup="true" [attr.aria-expanded]="tagsOpen()" (click)="toggleTagsPicker($event)">
          {{ tagSelectionLabel() }}
        </button>
        @if (tagsOpen()) {
          <div class="tags-options">
            <label class="tag-option">
              <input type="checkbox" [checked]="noTagsSelected()" (change)="toggleNoTags($any($event.target).checked)" />
              <span>No tags</span>
            </label>
            @for (tag of facets().tags || []; track tagCode(tag)) {
              <label class="tag-option">
                <input type="checkbox" [disabled]="noTagsSelected()" [checked]="isTagSelected(tagCode(tag))" (change)="toggleTagCode(tagCode(tag), $any($event.target).checked)" />
                <span>{{ tagLabel(tag) }}</span>
              </label>
            }
          </div>
        }
      </div>
    </div>
    <div class="games-field compact">
      <span>Period</span>
      <app-select-menu ariaLabel="Period" [value]="selectedPeriod()" [options]="periodOptions" panelAlign="end" (valueChange)="setPeriodValue($event)" />
    </div>
    <div class="games-field more-filters-field">
      <span>&nbsp;</span>
      <button type="button" class="more-filters-toggle" [attr.aria-expanded]="moreFiltersOpen()" (click)="moreFiltersOpen.set(!moreFiltersOpen())">
        More filters@if (advancedFilterCount() > 0) { ({{ advancedFilterCount() }} active) }
      </button>
    </div>
  </div>
  @if (moreFiltersOpen()) {
    <div class="games-filter-grid advanced-filters">
      <label class="games-field compact">
        <span>From</span>
        <input type="date" [ngModel]="filters().from" (ngModelChange)="setFilter('from', $event)" />
      </label>
      <label class="games-field compact">
        <span>To</span>
        <input type="date" [ngModel]="filters().to" (ngModelChange)="setFilter('to', $event)" />
      </label>
      <div class="games-field">
        <span>Indexed</span>
        <app-select-menu ariaLabel="Indexed" [value]="filters().plyIndexStatus" [options]="indexedOptions" (valueChange)="setFilterValue('plyIndexStatus', $event)" />
      </div>
      <label class="games-field">
        <span>Time control</span>
        <input [ngModel]="filters().timeControl" (ngModelChange)="setFilterValue('timeControl', $event)" placeholder="e.g. 10+5" />
      </label>
      <label class="games-field">
        <span>Opponent</span>
        <input [ngModel]="filters().opponent" (ngModelChange)="setFilterValue('opponent', $event)" placeholder="Username" />
      </label>
      <label class="games-field">
        <span>Opening</span>
        <input [ngModel]="filters().openingName" (ngModelChange)="setFilterValue('openingName', $event)" placeholder="Sicilian, London..." />
      </label>
      <label class="games-field compact">
        <span>Min accuracy</span>
        <input [ngModel]="filters().minAccuracy" (ngModelChange)="setFilterValue('minAccuracy', $event)" inputmode="decimal" placeholder="0" />
      </label>
      <label class="games-field compact">
        <span>Max accuracy</span>
        <input [ngModel]="filters().maxAccuracy" (ngModelChange)="setFilterValue('maxAccuracy', $event)" inputmode="decimal" placeholder="100" />
      </label>
      <label class="games-field compact">
        <span>Opp. rating &gt;</span>
        <input [ngModel]="filters().minOpponentRating" (ngModelChange)="setFilterValue('minOpponentRating', $event)" inputmode="numeric" placeholder="1200" />
      </label>
      <label class="games-field compact">
        <span>Opp. rating &lt;</span>
        <input [ngModel]="filters().maxOpponentRating" (ngModelChange)="setFilterValue('maxOpponentRating', $event)" inputmode="numeric" placeholder="2200" />
      </label>
    </div>
  }
  @if (showActions()) {
    <div class="games-filter-actions">
      <button type="button" class="primary" (click)="apply.emit()" [disabled]="loading()">
        {{ loading() ? 'Loading...' : applyLabel() }}
      </button>
      <button type="button" class="secondary" (click)="reset.emit()" [disabled]="loading()">Reset</button>
    </div>
  }
</section>
