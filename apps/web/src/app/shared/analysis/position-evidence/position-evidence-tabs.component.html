<app-panel
  class="position-evidence-shell"
  title="Position evidence"
  subtitle="Switch sources without adding more panels to the page."
>
  <div class="position-evidence-tabs" role="tablist" aria-label="Position evidence sources">
    @for (tab of tabs(); track tab.id; let index = $index) {
      <button
        #tabButton
        type="button"
        role="tab"
        [id]="idPrefix() + '-tab-' + tab.id"
        [class.active]="activeTab() === tab.id"
        [attr.aria-selected]="activeTab() === tab.id"
        [attr.aria-controls]="idPrefix() + '-tab-panel'"
        [attr.tabindex]="activeTab() === tab.id ? 0 : -1"
        (click)="selectTab(tab.id)"
        (keydown)="handleTabKeydown($event, index)"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <div
    [id]="idPrefix() + '-tab-panel'"
    class="position-evidence-tab-panel"
    role="tabpanel"
    [attr.aria-labelledby]="idPrefix() + '-tab-' + activeTab()"
  >
    <ng-content />
  </div>
</app-panel>
